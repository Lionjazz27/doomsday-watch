<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doomsday Watch</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomsday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #0b0d12; --card: #151922; --line: #252b38; --text: #eef1f6; --dim: #8b93a5;
    --green: #3ddc84; --green-bg: rgba(61,220,132,.12); --amber: #f5b942; --red: #ff6b6b; --accent: #7c8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 40px;
    max-width: 560px; margin-inline: auto;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 13px; }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .banner { margin: 16px 0; padding: 14px 16px; border-radius: 14px; font-weight: 600; }
  .banner.open { background: var(--green-bg); color: var(--green); border: 1px solid rgba(61,220,132,.35); }
  .banner.wait { background: var(--card); border: 1px solid var(--line); }
  .banner.warn { background: rgba(255,107,107,.1); color: var(--red); border: 1px solid rgba(255,107,107,.35); }
  .banner small { display: block; font-weight: 400; color: var(--dim); margin-top: 4px; }
  .day { margin-top: 22px; }
  .day h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  .day h2 .wk { color: var(--accent); margin-left: 6px; }
  .show {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom: 8px; text-decoration: none; color: inherit;
  }
  .show.is-open { border-color: rgba(61,220,132,.5); }
  .show .t { font-weight: 600; }
  .show .f { color: var(--dim); font-size: 12px; grid-column: 1; }
  .pill { grid-row: 1 / span 2; grid-column: 2; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .pill.open { background: var(--green-bg); color: var(--green); }
  .pill.full { color: var(--dim); border: 1px solid var(--line); }
  .empty { color: var(--dim); margin-top: 24px; }
  footer { margin-top: 28px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Doomsday Watch</h1>
    <div class="sub" id="sub">Chennai · English · night shows</div>
  </div>
  <button id="refresh" type="button">Refresh</button>
</header>

<div id="banner" class="banner wait">Loading…</div>
<div id="list"></div>
<footer id="foot">Alerts arrive through the ntfy app. This page refreshes every minute.</footer>

<script>
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const h = Math.floor(mins / 60);
  return h + " h " + (mins % 60) + " min ago";
}

function safeUrl(u) {
  return typeof u === "string" && u.startsWith("https://") ? u : "#";
}

async function load() {
  let s;
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    s = await r.json();
  } catch (e) {
    const b = $("banner");
    b.className = "banner warn";
    b.textContent = "No status yet";
    b.appendChild(el("small", null, "The watcher hasn't published a check. Run it once from the Actions tab."));
    return;
  }

  const shows = Array.isArray(s.shows) ? s.shows : [];
  const open = shows.filter((x) => x.open && x.open.length);
  const stale = (Date.now() - new Date(s.checked_at).getTime()) > 25 * 60000;
  const b = $("banner");
  b.textContent = "";

  if (!s.reachable) {
    b.className = "banner warn";
    b.textContent = "BookMyShow isn't answering the watcher";
    b.appendChild(el("small", null, (s.consecutive_failures || 0) + " failed checks in a row · last try " + ago(s.checked_at)));
  } else if (open.length) {
    b.className = "banner open";
    b.textContent = open.length + (open.length === 1 ? " night show has seats" : " night shows have seats");
    b.appendChild(el("small", null, "Checked " + ago(s.checked_at) + " · tap a green show to book"));
  } else {
    b.className = "banner " + (stale ? "warn" : "wait");
    b.textContent = shows.length ? "All watched night shows are full" : "No night shows listed at your theatres yet";
    b.appendChild(el("small", null, "Checked " + ago(s.checked_at) + (stale ? " · watcher may be paused" : "")));
  }

  const weekend = new Set(s.weekend_dates || []);
  const byDate = {};
  for (const x of shows) (byDate[x.date] = byDate[x.date] || []).push(x);

  const list = $("list");
  list.textContent = "";
  const dates = Object.keys(byDate).sort();
  if (!dates.length) {
    list.appendChild(el("p", "empty", "Watching: " + (s.theatres || []).join(", ")));
  }
  for (const d of dates) {
    const sec = el("section", "day");
    const h = el("h2", null, byDate[d][0].day);
    if (weekend.has(d)) h.appendChild(el("span", "wk", "weekend"));
    sec.appendChild(h);
    for (const x of byDate[d]) {
      const isOpen = x.open && x.open.length;
      const a = el("a", "show" + (isOpen ? " is-open" : ""));
      a.href = safeUrl(x.url);
      a.target = "_blank";
      a.rel = "noopener";
      a.appendChild(el("span", "t", x.theatre + " · " + x.time));
      const pill = isOpen
        ? el("span", "pill open", x.open[0].label + " · ₹" + Math.round(Number(x.open[0].price) || 0))
        : el("span", "pill full", "Full");
      a.appendChild(pill);
      a.appendChild(el("span", "f", x.format || x.venue));
      sec.appendChild(a);
    }
    list.appendChild(sec);
  }
}

$("refresh").addEventListener("click", load);
load();
setInterval(load, 60000);
</script>
</body>
</html>
