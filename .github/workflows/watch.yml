name: Doomsday Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest schedule; runs often start a few minutes late
  workflow_dispatch:          # "Run workflow" button for a manual check

concurrency:
  group: doomsday-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Check BookMyShow
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Save state and status page
        run: |
          git config user.name "doomsday-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json docs/status.json
          git diff --cached --quiet || git commit -q -m "status update [skip ci]"
          git pull -q --rebase && git push -q || echo "push skipped"
